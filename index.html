<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pemicu Alert Ganda</title>
</head>
<body>

    <h2>Klik tombol di bawah untuk memicu kedua alert secara bersamaan:</h2>
    <button onclick="pemicuAlertGanda()">Aktifkan Kamera & Alert</button>

    <script>
        function pemicuAlertGanda() {
            // 1. Picu izin kamera terlebih dahulu (Prompt Izin Browser)
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    console.log("Izin kamera diberikan.");
                })
                .catch(function(err) {
                    console.log("Izin kamera ditolak atau eror: " + err.name);
                });

            // 2. Gunakan setTimeout agar alert bawaan muncul tepat setelah prompt kamera keluar
            setTimeout(function() {
                alert("Ini adalah alert bawaan Chrome!");
            }, 50); 
        }
    </script>

</body>
</html>
