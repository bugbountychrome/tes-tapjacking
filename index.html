<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Izin: Kamera, Mikrofon & Lokasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #4b5563;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Container Utama */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 640px;
        }

        /* Kotak Kamera */
        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efek mirror */
        }

        .camera-placeholder {
            position: absolute;
            color: #9ca3af;
            text-align: center;
            z-index: 1;
        }

        /* Panel Status & Kontrol */
        .status-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .permission-item:last-child {
            border-bottom: none;
        }

        .permission-info {
            display: flex;
            flex-direction: column;
        }

        .permission-name {
            font-weight: 600;
            color: #374151;
        }

        .permission-detail {
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
        }

        /* Badge Status */
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .bg-pending { background-color: #fef3c7; color: #d97706; }
        .bg-success { background-color: #d1fae5; color: #065f46; }
        .bg-danger { background-color: #fee2e2; color: #991b1b; }

        /* Tombol Utama */
        .btn-grant {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .btn-grant:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>Dashboard Akses Sensor</h1>
    <p class="subtitle">Aplikasi ini memerlukan akses Kamera, Mikrofon, dan Lokasi Anda.</p>

    <div class="main-container">
        <!-- Kotak Kamera -->
        <div class="camera-box">
            <div id="camPlaceholder" class="camera-placeholder">
                <p>Kamera belum aktif</p>
            </div>
            <video id="webcam" autoplay playsinline style="display: none;"></video>
        </div>

        <!-- Daftar Status Izin -->
        <div class="status-card">
            <!-- Kamera -->
            <div class="permission-item">
                <div class="permission-info">
                    <span class="permission-name">📷 Kamera</span>
                    <span id="camDetail" class="permission-detail">Menunggu izin...</span>
                </div>
                <span id="badgeCam" class="badge bg-pending">Tertunda</span>
            </div>

            <!-- Mikrofon -->
            <div class="permission-item">
                <div class="permission-info">
                    <span class="permission-name">🎙️ Mikrofon (Suara)</span>
                    <span id="micDetail" class="permission-detail">Menunggu izin...</span>
                </div>
                <span id="badgeMic" class="badge bg-pending">Tertunda</span>
            </div>

            <!-- Lokasi -->
            <div class="permission-item">
                <div class="permission-info">
                    <span class="permission-name">📍 Lokasi GPS</span>
                    <span id="geoDetail" class="permission-detail">Menunggu izin...</span>
                </div>
                <span id="badgeGeo" class="badge bg-pending">Tertunda</span>
            </div>

            <!-- Tombol Minta Izin -->
            <button class="btn-grant" onclick="mintaSemuaIzin()">Aktifkan Semua Fitur</button>
        </div>
    </div>

    <script>
        // Fungsi pembantu untuk mengubah gaya badge status
        function updateBadge(id, status, text) {
            const badge = document.getElementById(id);
            badge.innerText = text;
            badge.className = 'badge'; // reset class
            
            if (status === 'success') badge.classList.add('bg-success');
            if (status === 'danger') badge.classList.add('bg-danger');
            if (status === 'pending') badge.classList.add('bg-pending');
        }

        async function mintaSemuaIzin() {
            // 1. MEMINTA IZIN KAMERA & MIKROFON SEKALIGUS
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true // Meminta izin mikrofon
                });

                // Jika Kamera & Mic Berhasil didapatkan
                const videoElem = document.getElementById('webcam');
                const placeholderElem = document.getElementById('camPlaceholder');
                
                videoElem.srcObject = stream;
                placeholderElem.style.display = 'none';
                videoElem.style.display = 'block';

                updateBadge('badgeCam', 'success', 'Diizinkan');
                document.getElementById('camDetail').innerText = "Kamera aktif secara real-time.";

                updateBadge('badgeMic', 'success', 'Diizinkan');
                document.getElementById('micDetail').innerText = "Audio terhubung dan aktif.";

            } catch (err) {
                console.error("Gagal akses media:", err);
                // Deteksi kegagalan spesifik (apakah salah satu atau keduanya ditolak)
                updateBadge('badgeCam', 'danger', 'Ditolak');
                document.getElementById('camDetail').innerText = "Gagal mengakses kamera/mikrofon.";
                
                updateBadge('badgeMic', 'danger', 'Ditolak');
                document.getElementById('micDetail').innerText = "Pastikan perangkat terpasang dan izin diberikan.";
            }

            // 2. MEMINTA IZIN LOKASI (GEOLOCATION)
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Jika izin lokasi diberikan
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        
                        updateBadge('badgeGeo', 'success', 'Diizinkan');
                        document.getElementById('geoDetail').innerText = `Koordinat: Lat ${lat}, Lon ${lon}`;
                    },
                    (error) => {
                        // Jika izin lokasi ditolak atau error
                        updateBadge('badgeGeo', 'danger', 'Ditolak');
                        if (error.code === error.PERMISSION_DENIED) {
                            document.getElementById('geoDetail').innerText = "Akses lokasi ditolak oleh pengguna.";
                        } else {
                            document.getElementById('geoDetail').innerText = "Gagal mendapatkan lokasi GPS.";
                        }
                    }
                );
            } else {
                updateBadge('badgeGeo', 'danger', 'Tidak Didukung');
                document.getElementById('geoDetail').innerText = "Browser Anda tidak mendukung Geolocation.";
            }
        }

        // Jalankan otomatis saat halaman selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            mintaSemuaIzin();
        });
    </script>
</body>
</html>
