<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Lintas Peramban: Manipulasi Lapisan DOM</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        /* Elemen Target Utama di Latar Belakang */
        .area-sensitif {
            padding: 30px;
            background-color: #ffcccc;
            border: 3px dashed #cc0000;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .tombol-target {
            padding: 15px 30px;
            background-color: #d9534f;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        /* Elemen Penguji Tumpang Tindih (Dialog) */
        dialog#modalUji {
            width: 80%;
            max-width: 400px;
            padding: 25px;
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            /* TITIK UJI 1: Manipulasi pointer agar klik menembus lapisan */
            pointer-events: auto; 
        }

        /* TITIK UJI 2: Penanganan Backdrop Lintas Mesin */
        dialog#modalUji::backdrop {
            /* Menguji apakah mesin peramban mengizinkan transparansi total */
            background-color: rgba(0, 0, 0, 0.1);
            
            /* Menguji dukungan filter blur (Sering bermasalah di WebKit/Safari versi lama) */
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        .kontrol-panel {
            margin-top: 20px;
            padding: 15px;
            background: #e2e8f0;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>Laboratorium Uji Tumpang Tindih DOM</h2>
    
    <!-- Area Latar Belakang -->
    <div class="area-sensitif">
        <p><strong>Konteks Sensitif:</strong> Tombol di bawah ini memicu aksi penting.</p>
        <button class="tombol-target" onclick="catatKlik()">[ KLIK DI SINI ]</button>
    </div>

    <button onclick="bukaModal()">1. Picu Elemen Tumpang Tindih</button>

    <!-- Modal Target -->
    <dialog id="modalUji">
        <h3>Lapisan Atas Aktif</h3>
        <p>Periksa apakah peramban Anda mengizinkan klik menembus area transparan di sekitar kotak ini ke tombol merah di belakang.</p>
        
        <div class="kontrol-panel">
            <button onclick="ubahPointerEvents('none')">Set pointer-events: none</button>
            <button onclick="ubahPointerEvents('auto')">Set pointer-events: auto</button>
        </div>
        <br>
        <button onclick="tutupModal()">2. Tutup Lapisan</button>
    </dialog>

    <p id="logAksi" style="color: blue; font-weight: bold; margin-top: 20px;"></p>

    <script>
        const modal = document.getElementById('modalUji');
        const log = document.getElementById('logAksi');

        function bukaModal() {
            modal.showModal();
            log.innerText = "Sistem: Elemen <dialog> terbuka menggunakan .showModal()";
        }

        function tutupModal() {
            modal.close();
            log.innerText = "Sistem: Elemen <dialog> ditutup.";
        }

        function catatKlik() {
            log.innerText = "AWAS: Tombol latar belakang berhasil diklik! (Click-through Terjadi)";
            log.style.color = "red";
        }

        function ubahPointerEvents(nilai) {
            modal.style.pointerEvents = nilai;
            log.innerText = `Gaya diubah: pointer-events = ${nilai}`;
        }
    </script>

</body>
</html>
