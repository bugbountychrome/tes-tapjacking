
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Download Spoofing PoC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #171923;
      color: #f1f1f1;
      padding: 32px 20px;
      text-align: center;
    }
    button {
      background: #4285f4;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <h2>Chrome Android Download PoC</h2>
  <p>
    Demo untuk menguji tampilan tab dan notifikasi unduhan.
    File yang dihasilkan bukan APK yang bisa diinstal.
  </p>

  <button id="run">Run PoC</button>
  <p id="status"></p>

  <script>
    document.getElementById("run").addEventListener("click", () => {
      // Open a clearly labelled demonstration tab.
      const demo = window.open("about:blank", "_blank");

      if (!demo) {
        document.getElementById("status").textContent =
          "Tab baru diblokir browser.";
        return;
      }

      demo.document.title = "Download UI Test";
      demo.document.body.style.cssText =
        "font:16px system-ui;padding:24px;color:#222";

      const heading = demo.document.createElement("h2");
      heading.textContent = "Download UI Test";

      const message = demo.document.createElement("p");
      message.textContent =
        "Controlled PoC. This page is not Google.";

      demo.document.body.append(heading, message);

      // Harmless text payload, deliberately not a valid APK.
      const payload = new Blob(
        ["Harmless download UI test. Not an Android application."],
        { type: "application/octet-stream" }
      );

      const url = URL.createObjectURL(payload);
      const link = demo.document.createElement("a");

      link.href = url;
      link.download = "Google.apk";
      link.textContent = "Download test file";

      demo.document.body.append(link);

      document.getElementById("status").textContent =
        "Tab demo dibuka. Tekan link di tab baru untuk mengunduh file uji.";
    });
  </script>
</body>
</html>
