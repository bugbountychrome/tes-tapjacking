
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Android Download UI Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #202124;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 23px;
      margin-top: 0;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #5f6368;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      background: #1558b0;
    }

    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Download UI Test</h1>

    <p>
      This proof of concept tests how Chrome for Android
      handles a new tab and a download initiated by one click.
    </p>

    <button id="runTest">
      Open Google and Start Download
    </button>

    <p id="status" role="status">
      Ready to run the test.
    </p>

    <p class="notice">
      This is a harmless UI test. The downloaded file contains
      plain text and is not a valid Android application.
    </p>
  </main>

  <script>
    document.getElementById("runTest").addEventListener("click", () => {
      // Open the real Google website in a new tab.
      const newTab = window.open("https://google.com", "_blank");

      // Create a harmless text payload, not an installable APK.
      const content = [
        "Chrome Android Download UI Test",
        "",
        "This file is a harmless proof-of-concept artifact.",
        "It is not an Android application."
      ].join("\n");

      const blob = new Blob(
        [content],
        { type: "application/octet-stream" }
      );

      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = objectUrl;
      link.download = "Google.apk";

      document.body.appendChild(link);
      link.click();
      link.remove();

      document.getElementById("status").textContent =
        newTab
          ? "Google was opened in a new tab and the download was requested."
          : "The new tab may have been blocked. The download was requested.";

      // Release the temporary object URL.
      setTimeout(() => {
        URL.revokeObjectURL(objectUrl);
      }, 10000);
    });
  </script>
</body>
</html>
